[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
name = "brezel-sdk"
version = "0.1.1"
description = "Python SDK for stateful, self-hosted Brezel agent sandboxes"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "InferCrane" }]
keywords = ["agents", "firecracker", "microvm", "sandbox", "self-hosted"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/infercrane/brezel#python-and-typescript-sdks"
Issues = "https://github.com/infercrane/brezel/issues"
Repository = "https://github.com/infercrane/brezel"

[tool.hatch.build.targets.wheel]
packages = ["src/brezel"]
