services:
  host-setup:
    pull_policy: never
    environment:
      # 32 active 512 MiB guests plus four lifecycle-overlap slots. The
      # product capacity gate verifies this reservation against both the API
      # quota and physical host memory before any engine build begins.
      HUGEPAGES: ${BREZEL_ENGINE_HUGEPAGES:-9216}
      # The kernel NBD module is the physical ceiling for the orchestrator's
      # device pool. Keep the host module and the process-level pool on the
      # same operator-owned value.
      NBDS_MAX: ${BREZEL_ENGINE_NBD_POOL_SIZE:-64}
      # Lazy Firecracker snapshot mappings reserve virtual commit before guest
      # pages are faulted in. The product-level global sandbox limit remains
      # the physical-memory admission boundary.
      BREZEL_VM_OVERCOMMIT_MEMORY: ${BREZEL_VM_OVERCOMMIT_MEMORY:-1}
    volumes:
      - ${BREZEL_HOST_TUNING_SCRIPT:?set BREZEL_HOST_TUNING_SCRIPT to the audited host tuning script}:/opt/brezel/host-tuning.sh:ro
    command: ["/bin/sh", "-c", "cat /opt/e2b/scripts/host-setup.sh /opt/brezel/host-tuning.sh | exec nsenter -t 1 -m -u -i -n -p -- /bin/bash -s"]

  postgres:
    image: ${BREZEL_ENGINE_POSTGRES_IMAGE:?set BREZEL_ENGINE_POSTGRES_IMAGE from engine.images.lock}
    pull_policy: never

  redis:
    image: ${BREZEL_ENGINE_REDIS_IMAGE:?set BREZEL_ENGINE_REDIS_IMAGE from engine.images.lock}
    pull_policy: never

  clickhouse:
    image: ${BREZEL_ENGINE_CLICKHOUSE_IMAGE:?set BREZEL_ENGINE_CLICKHOUSE_IMAGE from engine.images.lock}
    pull_policy: never

  vector:
    image: ${BREZEL_ENGINE_VECTOR_IMAGE:?set BREZEL_ENGINE_VECTOR_IMAGE from engine.images.lock}
    pull_policy: never

  db-migrator:
    pull_policy: never

  clickhouse-migrator:
    pull_policy: never

  seed:
    pull_policy: never

  brezel-engine-capacity:
    image: ${BREZEL_ENGINE_POSTGRES_IMAGE:?set BREZEL_ENGINE_POSTGRES_IMAGE from engine.images.lock}
    pull_policy: never
    restart: "no"
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      BREZEL_MAX_ACTIVE_SANDBOXES_TOTAL: ${BREZEL_MAX_ACTIVE_SANDBOXES_TOTAL:-32}
      BREZEL_GUEST_VCPUS: ${BREZEL_GUEST_VCPUS:-2}
      BREZEL_GUEST_MEMORY_MIB: ${BREZEL_GUEST_MEMORY_MIB:-512}
      BREZEL_GUEST_MIN_FREE_DISK_MIB: ${BREZEL_GUEST_MIN_FREE_DISK_MIB:-512}
      BREZEL_GUEST_MAX_FREE_DISK_MIB: ${BREZEL_GUEST_MAX_FREE_DISK_MIB:-25600}
    volumes:
      - ${BREZEL_ENGINE_CAPACITY_SCRIPT:?set BREZEL_ENGINE_CAPACITY_SCRIPT to the audited engine capacity script}:/opt/brezel/engine-capacity-contract.sh:ro
    entrypoint: ["/bin/sh"]
    command: ["/opt/brezel/engine-capacity-contract.sh", "apply"]

  brezel-engine-auth-cache:
    image: ${BREZEL_ENGINE_REDIS_IMAGE:?set BREZEL_ENGINE_REDIS_IMAGE from engine.images.lock}
    pull_policy: never
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
      brezel-engine-capacity:
        condition: service_completed_successfully
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ${BREZEL_ENGINE_AUTH_CACHE_SCRIPT:?set BREZEL_ENGINE_AUTH_CACHE_SCRIPT to the audited auth cache script}:/opt/brezel/engine-auth-cache-contract.sh:ro
    entrypoint: ["/bin/sh"]
    command: ["/opt/brezel/engine-auth-cache-contract.sh", "invalidate"]

  preflight:
    pull_policy: never

  fetch-artifacts:
    pull_policy: never
    environment:
      # This remains an external, checksum-verified source by default. An
      # operator mirror may use HTTPS, or file:///host/<absolute-host-path>
      # because the upstream fetcher mounts the host root at /host.
      BUCKET: ${BREZEL_ENGINE_ARTIFACT_BASE_URL:-https://storage.googleapis.com/e2b-artifact-binaries}

  brezel-orchestrator-install:
    image: ${E2B_TOOLS_IMAGE:?set E2B_TOOLS_IMAGE from engine.images.lock}
    pull_policy: never
    restart: "no"
    depends_on:
      fetch-artifacts:
        condition: service_completed_successfully
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    user: "0:0"
    environment:
      BREZEL_ENGINE_ORCHESTRATOR_SHA256: ${BREZEL_ENGINE_ORCHESTRATOR_SHA256:?set the verified source-built orchestrator digest}
    volumes:
      - /:/host
      - ${BREZEL_ENGINE_ORCHESTRATOR_BINARY:?set the protected source-built orchestrator path}:/brezel/orchestrator:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1m
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        expected="$$BREZEL_ENGINE_ORCHESTRATOR_SHA256"
        printf '%s\n' "$$expected" | grep -Eq '^[0-9a-f]{64}$$'
        actual=$$(sha256sum /brezel/orchestrator | awk '{print $$1}')
        [ "$$actual" = "$$expected" ]
        target_dir=/host/var/lib/e2b/bin
        [ -d "$$target_dir" ] && [ ! -L "$$target_dir" ]
        temporary="$$target_dir/.brezel-orchestrator.$$"
        trap 'rm -f -- "$$temporary"' EXIT HUP INT TERM
        cp /brezel/orchestrator "$$temporary"
        [ "$$(sha256sum "$$temporary" | awk '{print $$1}')" = "$$expected" ]
        chmod 0755 "$$temporary"
        mv -f -- "$$temporary" "$$target_dir/orchestrator"
        trap - EXIT HUP INT TERM

  api-secrets:
    pull_policy: never

  orchestrator:
    pull_policy: never
    depends_on:
      brezel-orchestrator-install:
        condition: service_completed_successfully
    environment:
      BREZEL_ENGINE_ORCHESTRATOR_SHA256: ${BREZEL_ENGINE_ORCHESTRATOR_SHA256:?set the verified source-built orchestrator digest}
      # Snapshot diffs are a recoverable performance cache, not durable
      # workspace state. Keep their retention and physical allocation bounded
      # independently of the host filesystem's last-resort pressure gate.
      BUILD_CACHE_TTL: ${BREZEL_BUILD_CACHE_TTL:?set the audited build cache TTL}
      BUILD_CACHE_MAX_BYTES: ${BREZEL_BUILD_CACHE_MAX_BYTES:?set the audited build cache byte high water}
      BUILD_CACHE_DISK_USAGE_HIGH_WATER_PERCENT: ${BREZEL_BUILD_CACHE_DISK_USAGE_HIGH_WATER_PERCENT:?set the audited build cache disk high water}
      # Keep concurrent VM starts within the locally qualified host envelope.
      # An explicit value is operator-owned and is not replaced by a remote
      # feature-flag refresh.
      MAX_STARTING_INSTANCES_PER_NODE: ${BREZEL_ENGINE_MAX_STARTING_SANDBOXES:?set the audited local starting-sandbox limit}
      NETWORK_NEW_SLOTS_POOL_SIZE: ${BREZEL_ENGINE_NETWORK_NEW_SLOTS:?set the audited new network-slot capacity}
      NETWORK_REUSED_SLOTS_POOL_SIZE: ${BREZEL_ENGINE_NETWORK_REUSED_SLOTS:?set the audited reused network-slot capacity}
      NBD_POOL_SIZE: ${BREZEL_ENGINE_NBD_POOL_SIZE:?set the audited NBD capacity}
      # The upstream launcher enters the host mount namespace before starting
      # the orchestrator. Pass the protected absolute host path rather than a
      # container mount target. The engine exposes workspace contents only
      # through its NFS bridge; the path is never mounted directly into a guest
      # or returned by the product API.
      PERSISTENT_VOLUME_MOUNTS: brezel-local:${BREZEL_WORKSPACE_DIR:?set BREZEL_WORKSPACE_DIR to an absolute protected directory}
      NODE_LABELS: persistent-volume-type=brezel-local

  api:
    image: ${BREZEL_ENGINE_API_IMAGE:?set BREZEL_ENGINE_API_IMAGE to the locally patched image}
    pull_policy: never
    environment:
      # The pinned engine requires a content-token signer before it will
      # create a volume, even though the product never returns that token.
      VOLUME_TOKEN_ENABLED: "true"
      VOLUME_TOKEN_ISSUER: brezel.local
      VOLUME_TOKEN_SIGNING_METHOD: HS256
      VOLUME_TOKEN_SIGNING_KEY_FILE: /run/runtime-volume-token/engine-volume-token.key
      VOLUME_TOKEN_SIGNING_KEY_NAME: local-brezel-v1
      DEFAULT_PERSISTENT_VOLUME_TYPE: brezel-local
    volumes:
      - type: bind
        source: ${BREZEL_VOLUME_TOKEN_KEY_FILE:?set BREZEL_VOLUME_TOKEN_KEY_FILE to a protected file}
        target: /run/runtime-volume-token/engine-volume-token.key
        read_only: true
    depends_on:
      brezel-engine-capacity:
        condition: service_completed_successfully
      brezel-engine-auth-cache:
        condition: service_completed_successfully

  client-proxy:
    pull_policy: never

  ready:
    pull_policy: never

  base-template:
    pull_policy: never
    environment:
      BASE_TEMPLATE_SOURCE_IMAGE: e2bdev/base@sha256:197ad15124a51884aea5a629b96045cd8300bdbbb6df648647004fad99fc59ec
      BASE_TEMPLATE_CPU_COUNT: ${BREZEL_GUEST_VCPUS:-2}
      BASE_TEMPLATE_MEMORY_MB: ${BREZEL_GUEST_MEMORY_MIB:-512}
      BASE_TEMPLATE_MIN_FREE_DISK_MB: ${BREZEL_GUEST_MIN_FREE_DISK_MIB:-512}

  smoke:
    pull_policy: never

  host-teardown:
    pull_policy: never
