// Derived from E2B Runtime's Apache-2.0 envd process contract.
// Pinned source revision: 767ceb4b2ec0e598f512767c8da9e5e6618da368.
syntax = "proto3";

package process;

option go_package = "github.com/infercrane/sandbox-runtime-lab/internal/backend/e2b/wire;wire";

service Process {
  rpc Start(StartRequest) returns (stream StartResponse);
}

message ProcessConfig {
  string cmd = 1;
  repeated string args = 2;
  map<string, string> envs = 3;
  optional string cwd = 4;
}

message StartRequest {
  ProcessConfig process = 1;
  optional bool stdin = 4;
}

message ProcessEvent {
  oneof event {
    StartEvent start = 1;
    DataEvent data = 2;
    EndEvent end = 3;
    KeepAlive keepalive = 4;
  }

  message StartEvent {
    uint32 pid = 1;
  }

  message DataEvent {
    oneof output {
      bytes stdout = 1;
      bytes stderr = 2;
      bytes pty = 3;
    }
  }

  message EndEvent {
    sint32 exit_code = 1;
    bool exited = 2;
    string status = 3;
    optional string error = 4;
  }

  message KeepAlive {}
}

message StartResponse {
  ProcessEvent event = 1;
}
