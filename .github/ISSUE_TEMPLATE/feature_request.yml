name: Feature request
description: Propose a small capability or product-contract improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the roadmap and existing issues.
          required: true
        - label: I can describe the user outcome without requiring a specific implementation.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What cannot an agent or operator accomplish today?
    validations:
      required: true
  - type: textarea
    id: interface
    attributes:
      label: Smallest useful interface
      description: Show the CLI or API behavior you would expect.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Trust, lifecycle, or compatibility impact
      description: Note any isolation, credential, persistence, recovery, or backward-compatibility implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
