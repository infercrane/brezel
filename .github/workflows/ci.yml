name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
      - name: Verify vendored engine patch chain with GNU patch
        run: ./deploy/single-host/verify-engine-patch-chain.sh
      - name: Repository checks
        run: make check
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Reject whitespace errors
        shell: bash
        run: |
          if [[ -n "${{ github.base_ref }}" ]]; then
            base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
            git diff --check "$base" HEAD
          else
            git diff-tree --check --no-commit-id --root -r HEAD
          fi
      - name: Build release image
        run: |
          docker build \
            --build-arg "BREZEL_VERSION=${GITHUB_SHA::12}" \
            --build-arg "BREZEL_REVISION=$GITHUB_SHA" \
            --build-arg "BREZEL_BUILT_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --tag brezel-ci:${{ github.sha }} .
          docker run --rm --entrypoint /usr/local/bin/brezel \
            brezel-ci:${{ github.sha }} version --json
