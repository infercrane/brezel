name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Unit, contract, and security-negative tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build release entrypoint
        run: |
          go build -trimpath -o bin/runtime-api ./cmd/runtime-api
          go build -trimpath -o bin/runtime-conformance ./cmd/runtime-conformance
          go build -trimpath -o bin/runtimectl ./cmd/runtimectl
      - name: Validate release shell entrypoints
        run: |
          sh -n deploy/single-host/install.sh
          sh -n deploy/single-host/qualify.sh
