name: release-sdks

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish @infercrane/brezel to npm
        required: true
        type: boolean
        default: true
      publish_pypi:
        description: Publish brezel-sdk to PyPI
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-latest
    environment: sdk-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Verify immutable release identity
        run: |
          test '${{ inputs.publish_npm }}' = 'true' || test '${{ inputs.publish_pypi }}' = 'true'
          test "$(git tag --points-at HEAD)" = "$GITHUB_REF_NAME"
          python scripts/check-sdk-versions.py --tag "$GITHUB_REF_NAME"
      - name: Test and build Python distribution
        run: |
          python -m pip install --disable-pip-version-check build==1.6.1 twine==7.0.0
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s sdk/python/tests -v
          python -m build sdk/python --outdir sdk/python/dist
          python -m twine check sdk/python/dist/*
      - name: Test and pack npm distribution
        working-directory: sdk/typescript
        run: |
          npm install --global npm@12.0.2
          npm ci --ignore-scripts
          npm run check
          npm run typecheck
          npm test
          npm pack --dry-run
      - name: Publish npm package with OIDC
        if: inputs.publish_npm
        working-directory: sdk/typescript
        run: npm publish
      - name: Publish Python package with OIDC
        if: inputs.publish_pypi
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/python/dist/
