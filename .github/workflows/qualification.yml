name: destructive-brezel-qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brezel-kvm-qualification
  cancel-in-progress: false

jobs:
  single-host-kvm:
    runs-on: [self-hosted, linux, x64, kvm, brezel]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inspect dedicated host
        run: |
          go build -trimpath -o bin/brezel ./cmd/brezel
          bin/brezel doctor
      - name: Install pinned runtime and run destructive qualification twice
        run: make qualify-single-host
      - name: Preserve content-free qualification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brezel-qualification
          path: .brezel/qualification/*.json
          if-no-files-found: warn
          retention-days: 30
